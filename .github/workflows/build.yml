name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build (Release, net48)
        run: dotnet build src/CsvToCivilTxt/CsvToCivilTxt.csproj -c Release

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: CsvToCivilTxt
          path: src/CsvToCivilTxt/bin/Release/net48/CsvToCivilTxt.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src/CsvToCivilTxt/bin/Release/net48/CsvToCivilTxt.exe
          generate_release_notes: true
